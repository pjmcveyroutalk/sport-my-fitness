<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Website Coming Soon | Sport My Fitness</title>
  <meta name="description" content="A new Sport My Fitness website is on the way. Contact Yoshi Barnes about personal training in Milwaukee.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101a21">
  <link rel="icon" href="/assets/brand/sport-my-fitness-original-lockup.png" type="image/png">
  <style>
    @font-face { font-family: 'Barlow Condensed'; src: url('/assets/barlow-condensed-900-italic.woff') format('woff'); font-style: italic; font-weight: 900; font-display: swap; }
    @font-face { font-family: Rajdhani; src: url('/assets/font-4.woff') format('woff'); font-weight: 700; font-display: swap; }
    :root { color-scheme: dark; --teal: #03d6df; --ink: #f4f7f7; --muted: #b5c3c6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: clamp(20px, 4vw, 56px); color: var(--ink); background: url('/assets/athletic-grain.svg') repeat, linear-gradient(122deg, transparent 48%, #90c6d119 48.1%, #28475344 48.3%, transparent 83%), radial-gradient(ellipse at 100% 0, #16636d80, transparent 65%), linear-gradient(120deg, #1a2c35, #101a21 58%, #132c34); background-size: 180px 180px, auto, auto, auto; font: 17px/1.6 Arial, Helvetica, sans-serif; }
    main { width: 100%; max-width: 1040px; border: 1px solid #527680; border-radius: 20px; overflow: hidden; background: linear-gradient(130deg, #0b1b22e8, #071014e8 65%, #102f38cc); box-shadow: 0 24px 80px #0005; }
    .brand-row { padding: 20px clamp(24px, 5vw, 64px); border-bottom: 1px solid #294149; background: #000; }
    .logo { display: block; width: 244px; max-width: 100%; height: auto; }
    .content { padding: clamp(28px, 5vw, 56px) clamp(24px, 5vw, 64px); }
    .eyebrow { margin: 0 0 16px; color: var(--teal); font: 700 15px/1.4 Rajdhani, Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: italic 900 clamp(48px, 7.8vw, 100px)/.96 'Barlow Condensed', Impact, sans-serif; letter-spacing: -.01em; text-transform: uppercase; }
    h1 span { display: block; color: var(--teal); }
    .intro { max-width: 550px; margin: 24px 0 0; color: var(--muted); font-size: clamp(17px, 2vw, 19px); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 28px; }
    a { color: var(--ink); text-underline-offset: 5px; }
    .call { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 12px 24px; border: 1px solid var(--teal); border-radius: 9px; color: #021114; background: var(--teal); font-weight: 700; text-decoration: none; }
    .call:hover { background: #4de6ec; }
    .email { display: inline-flex; align-items: center; min-height: 48px; }
    a:focus-visible { outline: 3px solid var(--teal); outline-offset: 5px; }
    footer { padding: 18px clamp(24px, 5vw, 64px); border-top: 1px solid #294149; color: var(--muted); font-size: 13px; }
    @media (max-width: 480px) { main { border-radius: 14px; } .brand-row { padding-block: 12px; } .logo { width: 220px; } .call { width: 100%; } .actions { gap: 8px; } }
  </style>
</head>
<body>
  <main aria-labelledby="coming-soon-heading">
    <header class="brand-row"><img class="logo" src="/assets/brand/sport-my-fitness-original-lockup.png" width="1100" height="725" alt="Sport My Fitness — Sport your best self."></header>
    <section class="content">
      <p class="eyebrow">Milwaukee · Personal training</p>
      <h1 id="coming-soon-heading">Our new website is <span>coming soon.</span></h1>
      <p class="intro">We’re putting the finishing touches on our new website. Training with Yoshi Barnes continues. Get in touch to talk about your goals.</p>
      <div class="actions">
        <a class="call" href="tel:+14147914526">Call Yoshi · 414-791-4526</a>
        <a class="email" href="mailto:Yoshi_barnes@outlook.com">Email Yoshi</a>
      </div>
    </section>
    <footer>© 2026 Sport My Fitness · Milwaukee</footer>
  </main>
</body>
</html>
