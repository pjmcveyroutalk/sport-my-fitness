name: Automatic water motion review
on:
  push:
    branches: ['review/water-motion-*']
permissions:
  contents: read
jobs:
  water-and-home-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and existing contracts
        run: |
          node --check home-water-motion.js
          node --check verification/home-lakefront-browser.cjs
          node --test test/pilot-verify-production.test.js test/apparel-catalog.test.mjs
          git diff --check
      - name: Install browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/smf-browser" --no-package-lock --no-save playwright@1.62.1 pngjs@7.0.0
          "$RUNNER_TEMP/smf-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify automatic ripples and existing Home geometry
        env:
          SMF_BASE_URL: http://127.0.0.1:8080
          SMF_EVIDENCE_DIR: ${{ runner.temp }}/smf-water-evidence
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > "$RUNNER_TEMP/smf-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/index.html > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/smf-browser/node_modules" node verification/home-lakefront-browser.cjs
          NODE_PATH="$RUNNER_TEMP/smf-browser/node_modules" node verification/home-trust-browser.cjs
      - name: Save focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-water-browser-evidence
          path: ${{ runner.temp }}/smf-water-evidence
          retention-days: 30
          if-no-files-found: warn
